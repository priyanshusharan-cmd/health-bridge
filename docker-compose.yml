services:
  backend:
    build: ./backend
    environment:
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-healthbridge}
      AI_BACKEND: ${AI_BACKEND:-extractive}
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:11434/v1}
      AI_MODEL: ${AI_MODEL:-qwen2.5:7b}
      AI_API_KEY: ${AI_API_KEY:-local}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    volumes:
      - healthbridge-data:/app/data
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      backend:
        condition: service_healthy
volumes:
  healthbridge-data:
