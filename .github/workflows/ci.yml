name: HealthBridge checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: python -m venv .venv && .venv/bin/pip install -r backend/requirements.lock.txt
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend test
      - run: PYTHONPATH=backend .venv/bin/pytest backend/tests -q
      - run: node frontend/tests/connection.mjs
      - run: .venv/bin/python scripts/release_check.py
      - run: .venv/bin/python scripts/evaluate_case.py
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker build -t healthbridge .
